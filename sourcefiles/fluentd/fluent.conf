# Fluentd configuration for log aggregation

<source>
  @type tail
  path /var/log/app/esapp.log
  pos_file /var/log/fluentd-esapp.log.pos
  tag esapp
  format json
  time_format %Y-%m-%dT%H:%M:%S.%NZ
  time_key timestamp
  keep_time_key true
  read_from_head true
</source>

<source>
  @type tail
  path /var/log/app/error.log
  pos_file /var/log/fluentd-error.log.pos
  tag esapp.error
  format multiline
  format_firstline /^\d{4}-\d{2}-\d{2}/
  format1 /^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \[(?<level>\w+)\] (?<message>.*)/
  time_format %Y-%m-%d %H:%M:%S
  keep_time_key true
  read_from_head true
</source>

<source>
  @type tail
  path /var/log/app/access.log
  pos_file /var/log/fluentd-access.log.pos
  tag esapp.access
  format nginx
  time_format %d/%b/%Y:%H:%M:%S %z
  keep_time_key true
  read_from_head true
</source>

<source>
  @type forward
  port 24224
  bind 0.0.0.0
  tag docker
</source>

<source>
  @type http
  port 9880
  bind 0.0.0.0
  body_size_limit 32m
  keepalive_timeout 10s
</source>

# Add hostname and other metadata
<filter **>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    service_name "${tag}"
    environment "${ENV['ENVIRONMENT'] || 'production'}"
  </record>
</filter>

# Send logs to Loki
<match esapp.**>
  @type loki
  url http://loki:3100
  username ""
  password ""
  tenant ""
  
  <label>
    service esapp
    environment production
    level ${record['level']}
  </label>
  
  <buffer>
    @type file
    path /var/log/fluentd-buffers/esapp.buffer
    flush_mode interval
    flush_interval 10s
    chunk_limit_size 1m
    queue_limit_length 1000
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

<match docker.**>
  @type loki
  url http://loki:3100
  username ""
  password ""
  tenant ""
  
  <label>
    service docker
    environment production
    container_name ${record['container_name']}
  </label>
  
  <buffer>
    @type file
    path /var/log/fluentd-buffers/docker.buffer
    flush_mode interval
    flush_interval 10s
    chunk_limit_size 1m
    queue_limit_length 1000
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

# Catch all other logs
<match **>
  @type stdout
</match>