global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@effective-solution.com'
  telegram_api_url: 'https://api.telegram.org'

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 30m
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 2h
    - match:
        service: esapp
      receiver: 'app-alerts'
      group_wait: 5s
      repeat_interval: 15m

receivers:
  - name: 'default-receiver'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        message: |
          🔔 *Alert Notification*
          
          *Alert:* {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          *Severity:* {{ .CommonLabels.severity }}
          *Service:* {{ .CommonLabels.service }}
          *Time:* {{ .CommonAnnotations.timestamp }}
          
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        parse_mode: 'Markdown'

  - name: 'critical-alerts'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        message: |
          🚨 *CRITICAL ALERT* 🚨
          
          *Alert:* {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          *Service:* {{ .CommonLabels.service }}
          *Time:* {{ .CommonAnnotations.timestamp }}
          
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
          
          ⚠️ *Immediate action required!*
        parse_mode: 'Markdown'

  - name: 'warning-alerts'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        message: |
          ⚠️ *Warning Alert*
          
          *Alert:* {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          *Service:* {{ .CommonLabels.service }}
          *Time:* {{ .CommonAnnotations.timestamp }}
          
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        parse_mode: 'Markdown'

  - name: 'app-alerts'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        message: |
          🔥 *Application Alert*
          
          *Alert:* {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          *Application:* {{ .CommonLabels.service }}
          *Time:* {{ .CommonAnnotations.timestamp }}
          
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
          
          🔍 Please check application logs immediately!
        parse_mode: 'Markdown'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
