[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root


[program:eq]
process_name=%(program_name)s_%(process_num)02d
command=php /application/artisan queue:work --timeout=0
autostart=true
autorestart=true
user=root
numprocs=5
redirect_stderr=true
stdout_logfile=/application/storage/logs/ESstage-worker.log

[program:es]
process_name=%(program_name)s_%(process_num)02d
command=php /application/artisan schedule:work
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/application/storage/logs/ESstage-sheduler.log

[program:eo]
process_name=%(program_name)s_%(process_num)02d
command=php /application/artisan octane:start --watch --port=9000 --host=0.0.0.0
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/application/storage/logs/ESstage-octane.log