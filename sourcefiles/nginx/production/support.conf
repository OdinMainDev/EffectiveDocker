map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name support.effective-solution.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://support.effective-solution.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name support.effective-solution.com;
    
    ssl_certificate /etc/letsencrypt/live/support.effective-solution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.effective-solution.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/support.effective-solution.com/chain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    client_max_body_size 108M;
    root /web_support;
    charset utf-8;
    access_log off;
    error_log  off;
    
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Max-Age 3600;
    add_header Access-Control-Expose-Headers Content-Length;
    add_header Access-Control-Allow-Headers Range;

	location / {
        try_files $uri /index.html;
    }
}
