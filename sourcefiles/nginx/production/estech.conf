map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name effective-solution.tech;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://effective-solution.tech$request_uri;
    }
}

server {
    listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    server_name effective-solution.tech;
    ssl_certificate /etc/letsencrypt/live/effective-solution.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/effective-solution.tech/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/effective-solution.tech/chain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    client_max_body_size 108M;
    root /application/public;
    charset utf-8;
    access_log off;
    error_log  /application/storage/logs/nginx-error.log error;
 
    location / {
		location ~ [^/]\.ph(p\d*|tml)$ {
			try_files /does_not_exists @octane;
		}
		location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpe?g|avi|zip|gz|bz2?|rar|swf|webp|woff|woff2)$ {
			expires 24h;
			try_files $uri $uri/ @octane;
		}
		location / {
			try_files /does_not_exists @octane;
		}
	}

	location @octane {
        set $suffix "";
 
        if ($uri = /index.php) {
            set $suffix ?$query_string;
        }
 
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
 
        proxy_pass http://php:9000$suffix;
        resolver 127.0.0.11;
    }
}
