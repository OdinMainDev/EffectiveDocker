map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name casino.effective-solution.tech;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://casino.effective-solution.tech$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name casino.effective-solution.tech;
    ssl_certificate /etc/letsencrypt/live/casino.effective-solution.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/casino.effective-solution.tech/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/casino.effective-solution.tech/chain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    client_max_body_size 108M;
    root /web_casino;
    charset utf-8;
    access_log off;
    error_log  off;
    
    # add_header 'Access-Control-Allow-Origin' "$http_origin" always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
    add_header 'Access-Control-Expose-Headers' 'Authorization' always;

	location / {
        try_files $uri $uri/index.html;
    }
}
