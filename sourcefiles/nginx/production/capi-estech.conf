map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # listen [::]:80;

    server_name capi.effective-solution.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://capi.effective-solution.com$request_uri;
    }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;

    server_name capi.effective-solution.com;
    ssl_certificate /etc/letsencrypt/live/capi.effective-solution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capi.effective-solution.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/capi.effective-solution.com/chain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    client_max_body_size 16M;
    root /web_admin;
    charset utf-8;
    access_log /var/log/nginx/capi-access.log;
    error_log  /var/log/nginx/capi-error.log;
    
    # add_header 'Access-Control-Allow-Origin' "$http_origin" always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
    add_header 'Access-Control-Expose-Headers' 'Authorization' always;

    location / {
        # proxy_buffering off;
        # proxy_http_version 1.1;
        # proxy_set_header   Host $host;
        # proxy_set_header   X-Real-IP $remote_addr;
        # proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header   X-Forwarded-Host $server_name;
        # # proxy_redirect     off;
        
        # proxy_pass http://esapp:10601;
        # resolver 127.0.0.11 ipv6=off;
        resolver 127.0.0.11 ipv6=off valid=30s;

        # real_ip_header X-Forwarded-For;
        # set_real_ip_from 0.0.0.0/0;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
        proxy_redirect off;

        proxy_set_header Scheme $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Powered-By;
        add_header Content-Security-Policy "upgrade-insecure-requests";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-transform" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag none;
    
        proxy_pass http://esapp:10601;
    }
}
