server {
    listen 80;
    listen [::]:80;

    server_name effective-solution.tech;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://effective-solution.tech$request_uri;
    }
}

