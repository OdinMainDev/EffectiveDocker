[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root


[program:App]
process_name=%(program_name)s_%(process_num)02d
command=/application/effectivesolution
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/application/storage/logs/supervisor.log


[program:Node]
process_name=%(program_name)s_%(process_num)02d
command=node /web_admin/build/index
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/application/storage/logs/supervisor-node.log