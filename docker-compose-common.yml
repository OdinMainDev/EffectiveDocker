version: "3.8"
services:
  esapp:
    image: effective-solution:latest
    container_name: esapp
    restart: always
    volumes:
      - ./storage:/storage
    networks:
      - internal
    env_file:
      - ./sourcefiles/app/.env

  nginx:
    image: nginx:1.25.4-alpine
    working_dir: /application
    container_name: esnginx
    volumes:
        - ./nginx:/application:rw
        - ./sourcefiles/certbot/www:/var/www/certbot:ro
        - ./sourcefiles/certbot/conf:/etc/letsencrypt:ro
    ports:
        - mode: host
          protocol: tcp
          published: 80
          target: 80
        - mode: host
          protocol: tcp
          published: 443
          target: 443
        - "3000:3000"
    environment:
      - APP_PORT_ADMIN=10600
      - APP_PORT_CASINO=10601
      - APP_PORT_GAMES=10602
      - APP_PORT_AFFILIATE=10603
      - SERVER_TYPE=${SERVER_TYPE}
      - DOMAIN_VERSION=${DOMAIN_VERSION}
    networks:
      - internal
    restart: always

  redis:
    image: redis:7.2.4-alpine
    container_name: esredis
    networks:
      - internal
    restart: always

  rabbitmq:
    image: rabbitmq:3.13.1-alpine
    container_name: esrabbitmq
    hostname: esrabbitmq
    volumes:
      - ./sourcefiles/rabbit/enabled_plugins.prod:/etc/rabbitmq/enabled_plugins:rw
      - ./sourcefiles/rabbit/plugins:/usr/lib/rabbitmq/plugins
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-esuser}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-espassword}
      - RABBITMQ_PLUGINS_DIR=/opt/rabbitmq/plugins:/usr/lib/rabbitmq/plugins
    networks:
      - internal
    restart: always

  clamav:
    image: clamav/clamav:1.3.0_base
    tty: true
    container_name: esclamav
    restart: always
    volumes:
      - ./sourcefiles/clamav:/var/lib/clamav
    environment:
      - CLAMD_STARTUP_TIMEOUT=1800
    networks:
      - internal

  # Open telemetry collector (for main app)
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.98.0
    volumes:
      - ./sourcefiles/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - internal
    restart: always

  # Traces database
  tempo:
    container_name: tempo
    image: grafana/tempo:main-f9b37a8
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./sourcefiles/tempo/tempo.yaml:/etc/tempo.yaml
    networks:
      - internal
    restart: always

  # Nginx metrics exporter
  nginx-prometheus-exporter:
    image: nginx/nginx-prometheus-exporter:1.0
    container_name: prometheus-nginx-exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx:8765/status
    networks:
      - internal

  # Redis metrics exporter
  redis_exporter:
    container_name: redis_exporter
    image: oliver006/redis_exporter:v1.58.0
    networks:
      - internal
    command:
      - '--redis.addr=redis://redis:6379'
    restart: always

  #  Metrics collector.
  #  It scrapes targets defined in --promscrape.config
  #  And forward them to --remoteWrite.url
  vmagent:
    container_name: vmagent
    image: victoriametrics/vmagent:v1.99.0
    volumes:
      - vmagentdata:/vmagentdata
      - ./sourcefiles/vmagent/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--remoteWrite.url=http://victoriametrics:8428/api/v1/write"
    networks:
      - internal
    restart: always

  # VictoriaMetrics instance, a single process responsible for
  # storing metrics and serve read requests.
  victoriametrics:
    container_name: victoriametrics
    image: victoriametrics/victoria-metrics:v1.99.0
    volumes:
      - vmdata:/storage
    command:
      - "--storageDataPath=/storage"
      - "--graphiteListenAddr=:2003"
      - "--opentsdbListenAddr=:4242"
      - "--httpListenAddr=:8428"
      - "--influxListenAddr=:8089"
      - "--vmalert.proxyURL=http://vmalert:8880"
    networks:
      - internal
    restart: always

  # Grafana instance configured with VictoriaMetrics as datasource
  grafana:
    container_name: grafana
    image: grafana/grafana:10.3.1
    volumes:
      - grafanadata:/var/lib/grafana
      - ./sourcefiles/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./sourcefiles/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./sourcefiles/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - internal
    restart: always

  # vmalert executes alerting and recording rules
  vmalert:
    container_name: vmalert
    image: victoriametrics/vmalert:v1.99.0
    volumes:
      - ./sourcefiles/vmalert/alerts.yml:/etc/alerts/alerts.yml
      - ./sourcefiles/vmalert/alerts-health.yml:/etc/alerts/alerts-health.yml
      - ./sourcefiles/vmalert/alerts-vmagent.yml:/etc/alerts/alerts-vmagent.yml
      - ./sourcefiles/vmalert/alerts-vmalert.yml:/etc/alerts/alerts-vmalert.yml
    command:
      - "--datasource.url=http://victoriametrics:8428/"
      - "--remoteRead.url=http://victoriametrics:8428/"
      - "--remoteWrite.url=http://victoriametrics:8428/"
      - "--notifier.url=http://alertmanager:9093/"
      - "--rule=/etc/alerts/*.yml"
      # when copypaste the line be aware of '$$' for escaping in '$expr'
      - '--external.alert.source=explore?orgId=1&left={"datasource":"VictoriaMetrics","queries":[{"expr":{{$$expr|jsonEscape|queryEscape}},"refId":"A"}],"range":{"from":"now-1h","to":"now"}}'
    networks:
      - internal
    restart: always

  # alertmanager receives alerting notifications from vmalert
  # and distributes them according to --config.file.
  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./sourcefiles/alertmanager/alertmanager.yml:/config/alertmanager.yml
    command:
      - "--config.file=/config/alertmanager.yml"
    networks:
      - internal
    restart: always

volumes:
  vmagentdata: {}
  vmdata: {}
  grafanadata: {}

networks:
  internal:
    driver: bridge
