version: "3.8"

services:
  # Loki - Centralized Logging
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./sourcefiles/loki/loki.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Promtail - Log Collector
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      - ./sourcefiles/promtail/promtail.yaml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./storage/logs:/var/log/esapp:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: always
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "6831:6831/udp"
      - "6832:6832/udp"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    volumes:
      - jaeger-data:/badger
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Jaeger Collector (separate for better performance)
  jaeger-collector:
    image: jaegertracing/jaeger-collector:latest
    container_name: jaeger-collector
    restart: always
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./sourcefiles/jaeger/jaeger.yaml:/etc/jaeger/config.yaml
    command: --config-file=/etc/jaeger/config.yaml
    depends_on:
      - jaeger
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Telegram Bot for Health Monitoring
  telegram-bot:
    build:
      context: ./sourcefiles/telegram-bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    restart: always
    volumes:
      - ./sourcefiles/telegram-bot/bot-config.yaml:/config/bot-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - HEALTH_CHECK_FULL_NOTIFICATIONS=${HEALTH_CHECK_FULL_NOTIFICATIONS:-false}
    depends_on:
      - alertmanager
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; print('Bot is running')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Log Aggregator for Application Logs
  fluentd:
    image: fluent/fluentd:latest
    container_name: fluentd
    restart: always
    volumes:
      - ./sourcefiles/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - ./storage/logs:/var/log/app:ro
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    depends_on:
      - loki
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:24220/api/plugins.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  loki-data:
  jaeger-data:

networks:
  internal:
    driver: bridge