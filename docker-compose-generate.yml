services:
  selfsigned-cert:
    image: alpine:latest
    container_name: selfsigned-cert
    volumes:
      - ./sourcefiles/certbot/conf:/certbot:rw
      - ./sourcefiles/certbot/generate-cert.sh:/generate-cert.sh:ro
    environment:
      - SERVER_TYPE=${SERVER_TYPE}
      - DOMAIN_VERSION=${DOMAIN_VERSION}
    entrypoint: sh /generate-cert.sh