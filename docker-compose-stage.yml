services:
  esapp:
    image: effective-solution:dev
    ports:
      - "10600:10600"
      - "10601:10601"
      - "10602:10602"
      - "10603:10603"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"

  nginx:
    environment:
      - SERVER_TYPE=-stage

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    volumes:
      - ./sourcefiles/rabbit/enabled_plugins.stage:/etc/rabbitmq/enabled_plugins:rw
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"

  otel-collector:
    ports:
      - "1888:1888"
      - "8888:8888"
      - "8889:8889"
      - "13133:13133"
      - "4318:4318"
      - "4317:4317"
      - "55679:55679"

  victoriametrics:
    ports:
      - "8428:8428"

  grafana:
    environment:
      - GF_SERVER_ROOT_URL=https://metrics-stage.effective-solution.com/
