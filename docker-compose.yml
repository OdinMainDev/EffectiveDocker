version: "3.1"
services:
    app:
      build: sourcefiles/app
      working_dir: /application
      container_name: esapp
      volumes:
        - ./build:/application
        - ./web_admin:/web_admin
        - ./sourcefiles/app/supervisord_${CONFIG_TYPE}.conf:/etc/supervisor/conf.d/supervisord.conf
      networks:
        - internal

    nginx:
      image: nginx:alpine
      working_dir: /application
      container_name: esnginx
      volumes:
          - ./build:/application
          - ./web_admin:/web_admin
          - ./web_casino:/web_casino
          - ./web_support:/web_support
          - ./sourcefiles/nginx/${CONFIG_TYPE}:/etc/nginx/conf.d
          - ./sourcefiles/certbot/www:/var/www/certbot:ro
          - ./sourcefiles/certbot/conf:/etc/letsencrypt:ro
      ports:
          - mode: host
            protocol: tcp
            published: 80
            target: 80
          - mode: host
            protocol: tcp
            published: 443
            target: 443
      networks:
        - internal

    redis:
      image: redis:alpine
      container_name: esredis
      # ports:
      #   - 6379:6379
      networks:
        - internal

    rabbitmq:
      image: rabbitmq:alpine
      container_name: esrabbitmq
      # ports:
      #   - 5672:5672
      environment:
        - RABBITMQ_DEFAULT_USER=esuser
        - RABBITMQ_DEFAULT_PASS=espassword
      networks:
        - internal

    certbot:
      image: certbot/certbot:latest
      container_name: escertbot
      volumes:
        - ./sourcefiles/certbot/www:/var/www/certbot:rw
        - ./sourcefiles/certbot/conf:/etc/letsencrypt:rw
        - ./sourcefiles/certbot:/certbot
      command: chmod +x "/certbot/${CONFIG_TYPE}.sh"
      entrypoint: sh -c "/certbot/${CONFIG_TYPE}.sh"

    clamav:
      # image: mkodockx/docker-clamav
      image: clamav/clamav:latest_base
      tty: true
      container_name: esclamav
      restart: unless-stopped
      volumes:
        - ./sourcefiles/clamav:/var/lib/clamav
      environment:
        - CLAMD_STARTUP_TIMEOUT=1800
      networks:
        - internal
      
networks:
  internal:
    driver: bridge
    # external: true