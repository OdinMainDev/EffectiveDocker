version: "3.1"
services:

    redis:
      image: redis:alpine
      container_name: redis
      # networks:
      #  - internal

    php:
      build: sourcefiles/php
      working_dir: /application
      container_name: php
      tty: true
      volumes:
        - ./application:/application
        # - ./sourcefiles/php/php-ini-overrides.ini:/etc/php/8.1/alpine/conf.d/99-overrides.ini
        - ./sourcefiles/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      networks:
        - internal

    webserver:
      image: nginx:alpine
      working_dir: /application
      container_name: webserver
      tty: true
      volumes:
          - ./application:/application
          - ./sourcefiles/nginx:/etc/nginx/conf.d
      ports:
        - "80:80"
      networks:
        - internal

networks:
  internal:
    driver: bridge