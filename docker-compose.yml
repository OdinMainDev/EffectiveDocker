version: "3.1"
services:

    redis:
      image: redis:alpine
      container_name: redis
      networks:
       - internal

    php:
      build: sourcefiles/php
      working_dir: /application
      container_name: php
      tty: true
      volumes:
        - ./application:/application
        # - ./sourcefiles/php/php-ini-overrides.ini:/etc/php/8.1/alpine/conf.d/99-overrides.ini
        - ./sourcefiles/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      networks:
        - internal

    webserver:
      image: nginx:alpine
      working_dir: /application
      container_name: webserver
      tty: true
      volumes:
          - ./application:/application
          - ./sourcefiles/nginx/${CONFIG_TYPE}:/etc/nginx/conf.d
          - ./sourcefiles/certbot/www:/var/www/certbot:ro
          - ./sourcefiles/certbot/conf:/etc/letsencrypt:ro
      ports:
        - "80:80"
        - "443:443"
      networks:
        - internal

    certbot:
      image: certbot/certbot:latest
      container_name: certbot
      volumes:
        - ./sourcefiles/certbot/www:/var/www/certbot:rw
        - ./sourcefiles/certbot/conf:/etc/letsencrypt:rw
        - ./sourcefiles/certbot:/certbot
      command: chmod +x "/certbot/${CONFIG_TYPE}.sh"
      entrypoint: sh -c "/certbot/${CONFIG_TYPE}.sh"

    clamav:
      # image: mkodockx/docker-clamav
      image: clamav/clamav:latest_base
      tty: true
      container_name: clamav
      restart: unless-stopped
      volumes:
        - ./sourcefiles/clamav:/var/lib/clamav
      environment:
        - CLAMD_STARTUP_TIMEOUT=1800
      networks:
        - internal
      
networks:
  internal:
    driver: bridge