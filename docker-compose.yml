version: "3.1"
services:

    redis:
      image: redis:alpine
      container_name: esredis
      networks:
       - internal

    main:
      build: sourcefiles/main
      working_dir: /application
      container_name: esmain
      tty: true
      volumes:
        - ./application:/application
        - ./sourcefiles/main/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      networks:
        - internal

    webserver:
      image: nginx:alpine
      working_dir: /application
      container_name: eswebserver
      tty: true
      volumes:
          - ./application:/application
          - ./sourcefiles/nginx/${CONFIG_TYPE}:/etc/nginx/conf.d
          - ./sourcefiles/certbot/www:/var/www/certbot:ro
          - ./sourcefiles/certbot/conf:/etc/letsencrypt:ro
      ports:
        - "80:80"
        - "443:443"
      networks:
        - internal

    certbot:
      image: certbot/certbot:latest
      container_name: escertbot
      volumes:
        - ./sourcefiles/certbot/www:/var/www/certbot:rw
        - ./sourcefiles/certbot/conf:/etc/letsencrypt:rw
        - ./sourcefiles/certbot:/certbot
      command: chmod +x "/certbot/${CONFIG_TYPE}.sh"
      entrypoint: sh -c "/certbot/${CONFIG_TYPE}.sh"

    clamav:
      # image: mkodockx/docker-clamav
      image: clamav/clamav:latest_base
      tty: true
      container_name: esclamav
      restart: unless-stopped
      volumes:
        - ./sourcefiles/clamav:/var/lib/clamav
      environment:
        - CLAMD_STARTUP_TIMEOUT=1800
      networks:
        - internal
      
networks:
  internal:
    driver: bridge