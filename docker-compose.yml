version: "3.1"
services:

    redis:
      image: redis:alpine
      container_name: EPredis

    webserver:
      image: nginx:alpine
      container_name: EPwebserver
      working_dir: /application
      volumes:
          - ./application:/application
          - ./sourcefiles/nginx:/etc/nginx/conf.d
      ports:
       - "80:80"
      networks:
            testing_net:
                ipv4_address: 172.28.1.3

    php:
      build: sourcefiles/php
      container_name: EPphp
      working_dir: /application
      volumes:
        - ./application:/application
        - ./sourcefiles/php/php-ini-overrides.ini:/etc/php/8.1/alpine/conf.d/99-overrides.ini
        - ./sourcefiles/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      networks:
          testing_net:
              ipv4_address: 172.28.1.4

networks:
    testing_net:
        ipam:
            driver: default
            config:
                - subnet: 172.28.0.0/16